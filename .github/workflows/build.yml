name: Build and Release

on:
    push:
        tags:
            - "v*" # Trigger on version tags
    workflow_dispatch:

jobs:
    # Step 1: Install dependencies and cache them
    dependencies:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Cache Python packages
              id: cache
              uses: actions/cache@v3
              with:
                  path: |
                      .venv
                  key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-venv-

            - name: Install dependencies if not cached
              if: steps.cache.outputs.cache-hit != 'true'
              run: |
                  python -m venv .venv
                  source .venv/bin/activate
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt
              shell: bash

            - name: Save environment as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-venv
                  path: .venv/

    # Step 2: Build for each OS concurrently
    build:
        needs: dependencies
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Download cached environment
              uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.os }}-venv

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Activate virtual environment and verify dependencies (Linux & macOS)
              if: runner.os != 'Windows'
              run: |
                  source .venv/bin/activate
                  pip install -r requirements-dev.txt
              shell: bash

            - name: Activate virtual environment and verify dependencies (Windows)
              if: runner.os == 'Windows'
              run: |
                  .\.venv\Scripts\activate
                  pip install -r requirements-dev.txt
              shell: powershell

            - name: Build with Nuitka (Linux)
              if: runner.os == 'Linux'
              run: |
                  source .venv/bin/activate
                  nuitka main.py \
                    --standalone \
                    --onefile \
                    --enable-plugin=pyside6 \
                    --include-data-dir=resources=resources \
                    --include-data-dir=src=src \
                    --output-dir=dist \
                    --output-filename=Spoon \
                    --assume-yes-for-downloads \
                    --remove-output \
                    --lto=yes \
                    --python-flag=-O \
                    --no-pyi-file
              shell: bash

            - name: Build with Nuitka (macOS)
              if: runner.os == 'macOS'
              run: |
                  source .venv/bin/activate
                  nuitka main.py \
                    --standalone \
                    --onefile \
                    --enable-plugin=pyside6 \
                    --include-data-dir=resources=resources \
                    --include-data-dir=src=src \
                    --output-dir=dist \
                    --output-filename=Spoon \
                    --assume-yes-for-downloads \
                    --remove-output \
                    --lto=yes \
                    --python-flag=-O \
                    --no-pyi-file
              shell: bash

            - name: Build with Nuitka (Windows)
              id: build-nuitka-windows
              if: runner.os == 'Windows'
              run: |
                  .\.venv\Scripts\activate
                  nuitka main.py `
                    --standalone `
                    --onefile `
                    --enable-plugin=pyside6 `
                    --windows-icon-from-ico=resources/spoon.ico `
                    --include-data-dir=resources=resources `
                    --include-data-dir=src=src `
                    --output-dir=dist `
                    --output-filename=Spoon.exe `
                    --assume-yes-for-downloads `
                    --remove-output `
                    --lto=yes `
                    --python-flag=-O `
                    --no-pyi-file
              shell: powershell
              continue-on-error: true

            - name: Upload Nuitka build artifact (Linux & macOS)
              if: runner.os != 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-build
                  path: dist/
                  if-no-files-found: error

            - name: Upload Nuitka build artifact (Windows)
              if: runner.os == 'Windows' && steps.build-nuitka-windows.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-build
                  path: dist/
                  if-no-files-found: error

    # Step 3: Create a release concurrently with builds
    release:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: write # Required for creating a release
            actions: read

        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: |
                      ubuntu-latest-build
                      macos-latest-build
                      windows-latest-build

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ubuntu-latest-build/*
                      macos-latest-build/*
                      windows-latest-build/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
